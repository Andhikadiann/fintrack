<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>FinTrack</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#1b1f1d;--mut:#66726c;--line:#e0e5e2;--pri:#0f6e56;--onpri:#fff;--in:#1b7f4b;--out:#c0392b;--soft:#e1f1ea;--warn:#fdecea}
@media(prefers-color-scheme:dark){:root{--bg:#111412;--card:#1a1f1c;--tx:#eaefec;--mut:#9aa6a0;--line:#2a322e;--pri:#4fc3a1;--onpri:#06241b;--in:#5fd28e;--out:#ff8a7a;--soft:#1d3830;--warn:#3a1f1c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,select,input,.row,.chip,.card{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
header b{font-size:18px}
.hb{display:flex;gap:8px}
.ib{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 11px;font-size:13px}
main{padding:12px 16px 170px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:var(--pri);color:var(--onpri);border:0}
.hero small{opacity:.85}
.hero .big{font-size:28px;font-weight:700;margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.g2 .card{margin:0}
.lab{font-size:12px;color:var(--mut)}
.val{font-size:17px;font-weight:700}
.in{color:var(--in)}.out{color:var(--out)}
h3{font-size:14px;margin:16px 0 8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);margin:4px 0 10px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--pri)}
.sp{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;background:var(--soft)}
.mid{flex:1;min-width:0}
.mid b{display:block;font-weight:600;font-size:14px}
.mid span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;font-size:14px;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line)}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 10px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;display:block}
nav button.on{color:var(--pri);font-weight:700}
#fab{position:fixed;right:max(16px,calc(50vw - 244px));bottom:72px;z-index:6;border:0;border-radius:16px;background:var(--pri);color:var(--onpri);padding:14px 20px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
#ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 28px}
.sheet h2{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:11px 12px;font-size:16px}
input.nom{font-size:24px;font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);color:var(--mut);padding:11px 0;font-size:14px}
.seg button.on{background:var(--soft);color:var(--pri);font-weight:700}
.btn{width:100%;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);padding:14px;font-size:16px;font-weight:700;margin-top:18px}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line);margin-top:10px}
.btn.del{background:var(--warn);color:var(--out);margin-top:10px}
.btn:disabled{opacity:.5}
.err{background:var(--warn);color:var(--out);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:30;display:none}
#chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 10px;padding:2px 16px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 14px;font-size:13px}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:700}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--warn);color:var(--out);margin-left:6px;font-weight:600}
.hd{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}.hd h3{margin:0}
.eye{border:0;background:none;color:var(--mut);padding:6px;border-radius:8px;line-height:0}.eye svg{width:22px;height:22px;display:block}
.kt{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}.kt b{font-size:17px}
.kb{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:8px;padding:5px 11px;font-size:12px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tl>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px}
.tl small{display:block;font-size:11px;color:var(--mut)}.tl b{display:block;font-size:16px;margin-top:2px}.tl em{font-style:normal;font-size:11px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:6px}
.bars>div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars span{font-size:11px;color:var(--mut);margin-bottom:2px;white-space:nowrap}
.bars i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--mut);opacity:.35}
.bars i.hi{background:var(--pri);opacity:1}
.lb{display:flex;gap:3px;font-size:11px;color:var(--mut);margin-top:3px}.lb span{flex:1;min-width:0;display:flex;justify-content:center;white-space:nowrap}
.rw{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:4px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.rw span{text-align:right}.rw span:first-child{text-align:left}
.rh{font-size:11px;color:var(--mut);border-top:0;padding-bottom:4px}
.note{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.5}
#bz{position:fixed;top:0;left:0;right:0;height:3px;background:var(--pri);z-index:40;display:none}
#sync{max-width:520px;margin:0 auto;padding:0 16px}
.sb{margin-top:8px;background:var(--soft);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sb.bad{background:var(--warn);color:var(--out)}

</style>

<body>
<div id="bz"></div>
<div id="app">
 <header><b>FinTrack</b><div class="hb"><button class="ib" id="per"></button><button class="ib" id="rf">Muat ulang</button></div></header>
<div id="sync"></div>
 <main id="main"><div class="empty">Memuat...</div></main>
 <button id="fab">+ Catat</button>
 <nav><div><button data-t="sum" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span>Ringkasan</span></button><button data-t="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span>Transaksi</span></button><button data-t="kin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Kinerja</span></button><button data-t="hut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span>Hutang</span></button><button data-t="acc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Setting</span></button></div></nav>
</div>

<script>
var MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var S={tab:'sum',from:'',to:'',d:null,h:null,k:null,kb:'',km:'harian',kAll:false,ht:'Hutang',token:'',err:''};
var SRC=['Pribadi','Usaha','Kontrakan'];
var EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function hideLoad(){try{return JSON.parse(localStorage.getItem('ft_hide'))||{}}catch(e){return {}}}
var HIDE=hideLoad();
function hid(k){return !!HIDE[k]}
function toggleHide(k){HIDE[k]=!HIDE[k];try{localStorage.setItem('ft_hide',JSON.stringify(HIDE))}catch(e){}render()}
function secHead(k,title,sub){return '<div class="hd"><h3>'+title+(sub?' <span class="lab" style="font-weight:400">'+sub+'</span>':'')+'</h3><button class="eye" data-eye="'+k+'" aria-label="'+(hid(k)?'Tampilkan ':'Sembunyikan ')+title+'">'+(hid(k)?EYE_OFF:EYE)+'</button></div>'}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function p2(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function money(n){n=Number(n)||0;return (n<0?'-':'')+'Rp '+Math.abs(n).toLocaleString('id-ID')}
function fdate(s){var a=String(s).split('-');return a.length==3?(+a[2])+' '+MON[+a[1]-1]+' '+a[0]:s}
function num(v){return Number(v)||0}
function genId(){return Date.now().toString(36)+'-'+Math.floor(Math.random()*1e9).toString(36)}
function getTok(){try{return localStorage.getItem('ft_tok')||''}catch(e){return ''}}
function setTok(v){try{if(v)localStorage.setItem('ft_tok',v);else localStorage.removeItem('ft_tok')}catch(e){}}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2200)}
function busy(b){$('bz').style.display=b?'block':'none'}
function monthRange(off){var n=new Date(),a=new Date(n.getFullYear(),n.getMonth()+off,1),b=new Date(n.getFullYear(),n.getMonth()+off+1,0);return [ymd(a),ymd(b)]}
var LBL={Pribadi:'Pribadi',Usaha:'Usaha',Kontrakan:'Kontrakan',Umum:'Belum dipisah'};
function nf(n){n=Number(n)||0;return (n<0?'-':'')+Math.abs(n).toLocaleString('id-ID')}
function lbl(v){return LBL[v]||v}
function presets(){
  var n=new Date(),d=(n.getDay()+6)%7,a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-d),b=new Date(n.getFullYear(),n.getMonth(),n.getDate()-d+6),y=n.getFullYear();
  return [
    {id:'today',t:'Hari ini',r:[ymd(n),ymd(n)]},
    {id:'week',t:'Minggu ini',r:[ymd(a),ymd(b)]},
    {id:'month',t:'Bulan ini',r:monthRange(0)},
    {id:'last',t:'Bulan lalu',r:monthRange(-1)},
    {id:'year',t:'Tahun ini',r:[y+'-01-01',y+'-12-31']}
  ];
}
function curPre(){var ps=presets();for(var i=0;i<ps.length;i++)if(ps[i].r[0]===S.from&&ps[i].r[1]===S.to)return ps[i].id;return ''}
function saveRange(id){try{localStorage.setItem('ft_per',id||(S.from+'|'+S.to))}catch(e){}}
function loadH(){busy(true);return call('hutang',{}).then(function(r){setH(r);render()}).catch(function(e){S.err=e.message;render()}).then(function(){busy(false)})}
function needH(cb){if(S.h)cb();else loadH().then(function(){if(S.h)cb()})}
function loadK(){
  if(!S.kb)S.kb=ymd(new Date()).slice(0,7);
  busy(true);
  return call('kinerja',{bulan:S.kb}).then(function(r){S.k=r;S.kErr='';render()}).catch(function(e){S.kErr=e.message;render()}).then(function(){busy(false)});
}
function refreshAll(){var p=[load()];if(S.k||S.tab==='kin')p.push(loadK());return Promise.all(p)}
function doW(action,payload,okMsg){busy(true);return call(action,payload).then(function(){toast(okMsg);return refreshAll()}).catch(function(e){toast(e.message)}).then(function(){busy(false)})}
function setPeriod(a,b,id){S.from=a;S.to=b;saveRange(id);load()}
function setPreset(id){var ps=presets();for(var i=0;i<ps.length;i++)if(ps[i].id===id)setPeriod(ps[i].r[0],ps[i].r[1],id)}
function restoreRange(){
  var v='today';try{v=localStorage.getItem('ft_per')||'today'}catch(e){}
  var ps=presets(),r=null;
  for(var i=0;i<ps.length;i++)if(ps[i].id===v)r=ps[i].r;
  if(!r&&v.indexOf('|')>0){var a=v.split('|');if(a[0]&&a[1]&&a[0]<=a[1])r=a}
  if(!r)r=ps[0].r;
  S.from=r[0];S.to=r[1];
}
function perLabel(){return S.from===S.to?fdate(S.from):fdate(S.from)+' - '+fdate(S.to)}
function chipsHtml(){
  var c=curPre(),h='<div id="chips">';
  presets().forEach(function(p){h+='<button class="chip'+(c===p.id?' on':'')+'" data-pre="'+p.id+'">'+p.t+'</button>'});
  return h+'<button class="chip'+(c?'':' on')+'" data-pre="custom">Atur tanggal</button></div>';
}

/* ===== varian PWA: offline-first ===== */
var LS={get:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var P={url:LS.get('ft_url')||'',queue:LS.get('ft_q')||[],failed:LS.get('ft_f')||[],cache:LS.get('ft_c')||{},hut:LS.get('ft_h')||null,last:LS.get('ft_t')||0,online:navigator.onLine!==false,flushing:null,note:'',B:{d:null,h:null},pref:''};
var QACT={addTransaction:1,transfer:1,addHutang:1,bayarHutang:1,addCategory:1};
function sv(){LS.set('ft_q',P.queue);LS.set('ft_f',P.failed)}
function pk(a,b){return a+'|'+b}
function netErr(m){var e=new Error(m||'Tidak ada koneksi');e.net=true;return e}
function markOnline(b){if(P.online!==b){P.online=b;renderSync()}}

/* ---- komunikasi dengan Apps Script (POST text/plain agar tanpa preflight CORS) ---- */
function rpc(action,data){
  return fetch(P.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:S.token,action:action,data:data||{}})})
    .then(function(r){return r.text()},function(){throw netErr()})
    .then(function(t){
      var j;try{j=JSON.parse(t)}catch(e){throw netErr('Respons server tidak dikenal. Pastikan URL benar dan akses deployment "Anyone".')}
      if(!j.ok)throw new Error(j.error||'Gagal');
      return j.result;
    });
}

/* ---- cache data terakhir ---- */
function cachePut(k,a,b,d){
  P.cache[k]={t:Date.now(),from:a,to:b,d:d};
  var ks=Object.keys(P.cache).sort(function(x,y){return P.cache[y].t-P.cache[x].t});
  ks.slice(8).forEach(function(x){delete P.cache[x]});
  LS.set('ft_c',P.cache);P.last=Date.now();LS.set('ft_t',P.last);
}
function readBoot(a){
  var k=pk(a.from,a.to);
  return (P.flushing||Promise.resolve()).then(function(){return rpc('bootstrap',a)}).then(function(r){
    if(r.hutang){P.hut=r.hutang;LS.set('ft_h',r.hutang)}
    cachePut(k,a.from,a.to,r);markOnline(true);P.note='';setTimeout(prefetch,2500);return r;
  },function(e){
    if(!e.net)throw e;
    markOnline(false);
    var c=P.cache[k];
    if(c){P.note='';return withHut(c.d)}
    var best=null;for(var x in P.cache)if(!best||P.cache[x].t>best.t)best=P.cache[x];
    if(best){S.from=best.from;S.to=best.to;P.note='Periode yang dipilih belum tersimpan untuk offline. Menampilkan data tersimpan: '+fdate(best.from)+(best.from===best.to?'':' - '+fdate(best.to))+'.';return withHut(best.d)}
    throw e;
  });
}
function withHut(d){var o=Object.assign({},d);if(P.hut)o.hutang=P.hut;return o}
function peekCache(a,b){var c=P.cache[pk(a,b)];return c?withHut(c.d):null}
function saveCache(){}
function readHut(){
  return (P.flushing||Promise.resolve()).then(function(){return rpc('hutang',{})}).then(function(r){P.hut=r;LS.set('ft_h',r);markOnline(true);return r},function(e){
    if(!e.net)throw e;
    markOnline(false);
    if(P.hut)return P.hut;
    throw e;
  });
}
/* ---- kinerja usaha: data terakhir per bulan tetap bisa dibuka offline ---- */
function kinIdx(k){var ix=(LS.get('ft_ki')||[]).filter(function(x){return x!==k});ix.unshift(k);ix.slice(6).forEach(function(x){LS.del(x)});LS.set('ft_ki',ix.slice(0,6))}
function clearK(){(LS.get('ft_ki')||[]).forEach(function(x){LS.del(x)});LS.del('ft_ki')}
function readKin(a){
  var k='ft_k:'+a.bulan;
  return (P.flushing||Promise.resolve()).then(function(){return rpc('kinerja',a)}).then(function(r){LS.set(k,{t:Date.now(),d:r});kinIdx(k);markOnline(true);return r},function(e){
    if(!e.net)throw e;
    markOnline(false);
    var c=LS.get(k);if(c)return c.d;
    throw new Error('Data kinerja bulan ini belum tersimpan untuk offline. Buka menu Kinerja saat online dulu.');
  });
}
function kPending(){return P.queue.filter(function(x){return x.action==='addTransaction'}).map(function(x){return x.data})}
function prefetch(){
  var day=ymd(new Date());if(P.pref===day||!P.online)return;P.pref=day;
  var chain=Promise.resolve();
  presets().filter(function(p){return p.id==='today'||p.id==='month'}).forEach(function(p){
    var k=pk(p.r[0],p.r[1]);
    if(P.cache[k]&&Date.now()-P.cache[k].t<300000)return;
    chain=chain.then(function(){return rpc('bootstrap',{from:p.r[0],to:p.r[1]}).then(function(r){cachePut(k,p.r[0],p.r[1],r)})});
  });
  chain.catch(function(){P.pref=''});
}

/* ---- antrean pengiriman ---- */
function settle(){return flush()}
function call(action,data){
  if(action==='kinerja')return readKin(data);
  if(action==='bootstrap')return readBoot(data);
  if(action==='hutang')return readHut();
  if(QACT[action])return enqueue(action,data);
  return rpc(action,data).catch(function(e){if(e.net)throw new Error('Butuh internet untuk ini.');throw e});
}
function enqueue(action,data){
  P.queue.push({qid:genId(),action:action,data:data,ts:Date.now()});
  sv();reproject();render();
  setTimeout(flush,50);
  return Promise.resolve({queued:true});
}
function flush(){
  if(P.flushing)return P.flushing;
  if(!P.queue.length)return Promise.resolve();
  var sent=0;
  P.flushing=(function step(){
    if(!P.queue.length)return Promise.resolve();
    var it=P.queue[0];
    return rpc(it.action,it.data).then(function(){
      markOnline(true);P.queue.shift();sent++;sv();return step();
    },function(e){
      if(e.net){markOnline(false);if(/Respons server/.test(e.message))P.note=e.message;return}
      P.queue.shift();P.failed.push({qid:it.qid,action:it.action,data:it.data,err:e.message,ts:it.ts});sv();return step();
    });
  })().then(function(){
    P.flushing=null;
    if(sent){P.cache={};LS.set('ft_c',P.cache);P.pref='';return refreshAll()}
    reproject();render();
  },function(){P.flushing=null});
  return P.flushing;
}

/* ---- proyeksi: terapkan catatan yang belum terkirim ke data tersimpan ---- */
function setD(r){var c=Object.assign({},r);delete c.hutang;P.B.d=c;reproject()}
function setH(r){P.B.h=r;reproject()}
function reproject(){var o=project(P.B.d,P.B.h,P.queue);S.d=o.d;S.h=o.h}
function project(d0,h0,q){
  if(!d0)return {d:d0,h:h0?JSON.parse(JSON.stringify(h0)):null};
  var d=JSON.parse(JSON.stringify(d0)),h=h0?JSON.parse(JSON.stringify(h0)):null,sm=d.summary,per=sm.periode||{};
  function inR(t){return (!per.from||t>=per.from)&&(!per.to||t<=per.to)}
  function sal(id,n){sm.totalSaldo+=n;(sm.saldoPerAkun||[]).forEach(function(a){if(String(a.akun_id)===String(id))a.saldo+=n})}
  function bump(jenis,sumber,n,kat){
    var f=(jenis==='Pemasukan'?'pemasukan':'pengeluaran')+sumber;sm[f]=(sm[f]||0)+n;
    if(jenis==='Pemasukan')sm.totalPemasukan+=n;else sm.totalPengeluaran+=n;
    sm.arusKasBersih=sm.totalPemasukan-sm.totalPengeluaran;
    var k=(sm.perKategori||[]).filter(function(x){return x.jenis===jenis&&x.kategori===kat})[0];
    if(k)k.total+=n;else(sm.perKategori=sm.perKategori||[]).push({jenis:jenis,kategori:kat,total:n});
    sm.perKategori.sort(function(a,b){return b.total-a.total});
  }
  function addTx(t,neutral){sal(t.akun_id,t.jenis==='Pemasukan'?t.nominal:-t.nominal);if(inR(t.tanggal)){d.transactions.unshift(t);if(!neutral)bump(t.jenis,t.sumber,t.nominal,t.kategori)}}
  function hpTot(jenis,n){[h&&h.totals,d.hp].forEach(function(T){if(!T)return;if(jenis==='Hutang')T.totalHutang+=n;else T.totalPiutang+=n})}
  q.forEach(function(it){
    var x=it.data,ts=new Date(it.ts).toISOString();
    if(it.action==='addCategory'){
      if(!d.categories.some(function(c){return c.jenis===x.jenis&&String(c.nama_kategori).toLowerCase()===String(x.nama_kategori).toLowerCase()}))d.categories.push({kategori_id:'tmp-'+it.qid,nama_kategori:x.nama_kategori,jenis:x.jenis,sumber_default:x.sumber_default,aktif:true});
    }else if(it.action==='addTransaction'){
      addTx({id:x.id,tanggal:x.tanggal,jenis:x.jenis,sumber:x.sumber,kategori:x.kategori,akun_id:x.akun_id,deskripsi:x.deskripsi||'',nominal:x.nominal,referensi_id:'',created_at:ts,_q:it.qid},false);
    }else if(it.action==='transfer'){
      sal(x.akun_asal,-x.nominal);sal(x.akun_tujuan,x.nominal);
      if(inR(x.tanggal))d.transfers.unshift({id:x.id,tanggal:x.tanggal,akun_asal:x.akun_asal,akun_tujuan:x.akun_tujuan,nominal:x.nominal,catatan:x.catatan||'',created_at:ts,_q:it.qid});
    }else if(it.action==='addHutang'){
      var out=x.jenis==='Hutang';
      addTx({id:'hut-'+x.id,tanggal:x.tanggal,jenis:out?'Pemasukan':'Pengeluaran',sumber:'Umum',kategori:'Hutang piutang',akun_id:x.akun_id,deskripsi:(out?'Pinjaman dari ':'Pinjaman ke ')+x.pihak,nominal:x.nominal,referensi_id:'HP:N:'+x.id,created_at:ts,_q:it.qid},true);
      hpTot(x.jenis,x.nominal);
      if(h)h.items.unshift({hutang_id:x.id,tanggal:x.tanggal,jenis:x.jenis,pihak:x.pihak,nominal:x.nominal,jatuh_tempo:x.jatuh_tempo||'',tipe:'Pinjaman',kategori:'',sumber:'Umum',akun_id:x.akun_id,catatan:x.catatan||'',terbayar:0,sisa:x.nominal,lunas:false,terlambat:false,cicilan:[],_q:it.qid});
    }else if(it.action==='bayarHutang'){
      var hi=h?h.items.filter(function(z){return z.hutang_id===x.hutang_id})[0]:null;
      if(!hi)return;
      var keluar=hi.jenis==='Hutang',neu=hi.tipe==='Pinjaman';
      addTx({id:'cil-'+x.id,tanggal:x.tanggal,jenis:keluar?'Pengeluaran':'Pemasukan',sumber:neu?'Umum':hi.sumber,kategori:neu?'Hutang piutang':hi.kategori,akun_id:x.akun_id,deskripsi:(keluar?'Bayar hutang ke ':'Terima piutang dari ')+hi.pihak,nominal:x.nominal,referensi_id:(neu?'HP:N:':'HP:T:')+hi.hutang_id+':'+x.id,created_at:ts,_q:it.qid},neu);
      hi.terbayar+=x.nominal;hi.sisa=Math.max(0,hi.sisa-x.nominal);hi.lunas=hi.sisa<=0.001;
      hi.cicilan.push({cicilan_id:x.id,tanggal:x.tanggal,nominal:x.nominal,akun_id:x.akun_id,catatan:x.catatan||'',_q:it.qid});
      hpTot(hi.jenis,-x.nominal);
    }
  });
  return {d:d,h:h};
}

/* ---- tampilan status sinkronisasi ---- */
function describe(it){
  var x=it.data;
  if(it.action==='addCategory')return 'Kategori baru: '+x.nama_kategori;
  if(it.action==='addTransaction')return x.jenis+' '+money(x.nominal)+' · '+x.kategori;
  if(it.action==='transfer')return 'Transfer '+money(x.nominal);

function boot(){
  restoreRange();S.token=getTok();$('per').textContent=perLabel();
  var c=P.cache[pk(S.from,S.to)];

function load(){
  var pk=peekCache(S.from,S.to);            // tampilkan data tersimpan lebih dulu, lalu segarkan di latar belakang
  if(pk){setD(pk);if(pk.hutang)setH(pk.hutang);S.err='';render()}
  busy(true);
  return call('bootstrap',{from:S.from,to:S.to}).then(function(r){saveCache(S.from,S.to,r);setD(r);if(r.hutang)setH(r.hutang);S.err='';render()}).catch(function(e){
    S.err=e.message;

    render();
  }).then(function(){busy(false)});
}

function catOpts(cats,kep,cur){
  var m=cats.filter(function(c){return c.sumber_default===kep}),o=cats.filter(function(c){return m.indexOf(c)<0});

function sendSteps(btn,steps,okMsg){

  p.then(function(){closeSheet();toast(okMsg);return refreshAll()}).catch(function(e){btn.disabled=false;ferr(e.message)});
}

  var d=S.d,id=ex?ex.id:genId(),cats=d.categories.filter(function(c){return c.jenis===jenis&&c.nama_kategori!=='Hutang piutang'});

  $('h_ok').onclick=function(){

    if(!p)return ferr('Isi nama pihak.');if(n<=0)return ferr('Isi nominal lebih dari 0.');if(!$('h_ak').value)return ferr('Pilih akun.');if(jt&&jt<t)return ferr('Jatuh tempo tidak boleh sebelum tanggal catat.');
    sendForm(this,'addHutang',{id:id,tanggal:t,jenis:jenis,pihak:p,nominal:n,jatuh_tempo:jt,akun_id:$('h_ak').value,catatan:$('h_c').value.trim()},jenis==='Hutang'?'Hutang dicatat':'Piutang dicatat');
  };
}


/* ---------- kinerja usaha ---------- */
var MONF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var DAYN=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function rbu(n){return Math.round(n/1000)+' rb'}
function pct1(g){return (g>=0?'+':'-')+Math.abs(g).toFixed(1).replace('.',',')+'%'}
function kApply(k){
  var c=JSON.parse(JSON.stringify(k));
  kPending().forEach(function(t){
    if(t.sumber!=='Usaha')return;
    var key=t.jenis==='Pemasukan'?'o':'k',n=Number(t.nominal)||0;
    c.hari.forEach(function(x){if(x.t===t.tanggal)x[key]+=n});
    c.bln.forEach(function(x){if(x.b===String(t.tanggal).slice(0,7))x[key]+=n});
  });
  return c;
}
function tiles(a){return '<div class="tl">'+a.map(function(x){return '<div><small>'+x[0]+'</small><b'+(x[3]?' class="'+x[3]+'"':'')+'>'+x[1]+'</b><em>'+x[2]+'</em></div>'}).join('')+'</div>'}
function vKin(){
  var kb=S.kb||ymd(new Date()).slice(0,7),mode=S.km;
  var h=(S.kErr?'<div class="err">'+esc(S.kErr)+'</div>':'')+'<div class="kt"><b>Kinerja usaha</b><button class="kb" id="kPick">'+(mode==='harian'?MON[+kb.slice(5,7)-1]+' '+kb.slice(0,4):kb.slice(0,4))+'</button></div>';
  h+='<div class="seg">'+[['harian','Harian'],['bulanan','Bulanan']].map(function(x){return '<button data-km="'+x[0]+'" class="'+(mode===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(!S.k)return h+(S.kErr?'':'<div class="empty">Memuat kinerja usaha...</div>');
  var k=kApply(S.k),th=k.today,y=k.tahun,mo=+k.bulan.slice(5,7);
  return h+(mode==='harian'?kHarian(k,th,y,mo):kBulanan(k,th,y));
}
function kHarian(k,th,y,mo){
  var cur=k.bulan===th.slice(0,7),upto=cur?+th.slice(8,10):(k.bulan<th.slice(0,7)?k.hari.length:0);
  var days=k.hari.slice(0,upto),O=0,K=0,buka=0,best=null,bi=-1;
  days.forEach(function(x,i){O+=x.o;K+=x.k;if(x.o>0){buka++;if(!best||x.o>best.o){best=x;bi=i}}});
  var nm=cur?'bulan ini':MONF[mo-1],h=tiles([
    ['Omzet '+nm,money(O),buka+' hari buka'],
    ['Pengeluaran usaha',money(K),O>0?Math.round(K/O*100)+'% dari omzet':'-'],
    ['Sisa (omzet - keluar)',money(O-K),O>0?Math.round((O-K)/O*100)+'% dari omzet':'-',O-K<0?'out':''],
    ['Rata-rata per hari buka',money(buka?Math.round(O/buka):0),best?'Terbaik '+(+best.t.slice(8))+' '+MON[mo-1]+': '+rbu(best.o):'Belum ada penjualan']
  ]);
  if(!days.length)return h+'<div class="card"><div class="lab">Belum ada hari yang berjalan pada bulan ini.</div></div>';
  var mx=Math.max.apply(null,days.map(function(x){return x.o}))||1,hi=cur?days.length-1:bi,bars='',lb='',n=days.length;
  days.forEach(function(x,i){
    var hh=x.o?Math.max(4,Math.round(x.o/mx*104)):2;
    bars+='<div>'+(i===hi&&x.o?'<span>'+Math.round(x.o/1000)+'</span>':'')+'<i class="'+(i===hi?'hi':'')+'" style="height:'+hh+'px"></i></div>';
    lb+='<span>'+((n<=16||i===0||(i+1)%5===0)?(i+1):'')+'</span>';
  });
  h+='<div class="card"><div class="sp"><b>Omzet per hari</b><span class="lab">ribu rupiah</span></div><div class="bars">'+bars+'</div><div class="lb">'+lb+'</div></div>';
  h+='<h3>Rincian harian</h3><div class="card" style="padding:6px 14px"><div class="rw rh"><span>Tanggal</span><span>Omzet</span><span>Keluar</span><span>Sisa</span></div>';
  var rows=days.slice().reverse(),shown=S.kAll?rows:rows.slice(0,7);
  shown.forEach(function(x){
    var d=+x.t.slice(8),lab=d+' '+MON[mo-1]+' ('+DAYN[new Date(y,mo-1,d).getDay()]+')';
    if(!x.o&&!x.k)h+='<div class="rw"><span>'+lab+'</span><span style="grid-column:span 3;color:var(--mut);text-align:left">Tutup, tidak ada transaksi</span></div>';
    else h+='<div class="rw"><span>'+lab+'</span><span>'+nf(x.o)+'</span><span>'+nf(x.k)+'</span><span class="'+(x.o-x.k<0?'out':'')+'">'+nf(x.o-x.k)+'</span></div>';
  });
  h+='</div>';
  if(rows.length>7)h+='<button class="btn sec" id="kAll">'+(S.kAll?'Ringkas':'Tampilkan semua hari')+'</button>';
  return h+'<div class="note">Omzet adalah semua pemasukan berkeperluan Usaha, dan keluar adalah semua pengeluaran berkeperluan Usaha. Sisa belum memperhitungkan stok bahan.</div>';
}
function kBulanan(k,th,y){
  var ty=+th.slice(0,4),curY=y===ty,last=y<ty?11:(curY?+th.slice(5,7)-1:-1),curM=curY?last:-1;
  var ms=k.bln.slice(0,last+1);
  if(!ms.length)return '<div class="card"><div class="lab" style="padding:8px 0">Belum ada bulan yang berjalan pada tahun ini.</div></div>';
  var tot=0,full=[],best=-1;
  ms.forEach(function(x,i){tot+=x.o;if(i!==curM&&x.o>0)full.push(i);if(x.o>0&&(best<0||x.o>ms[best].o))best=i});
  var avg=full.length?full.reduce(function(a,i){return a+ms[i].o},0)/full.length:null;
  var L=full.length?full[full.length-1]:-1,P2=L-1,g=null,df=0;
  if(L>0&&ms[P2].o>0){g=(ms[L].o-ms[P2].o)/ms[P2].o*100;df=ms[L].o-ms[P2].o}
  var h=tiles([
    ['Omzet '+y,money(tot),MON[0]+' sampai '+MON[last]],
    ['Rata-rata per bulan',avg===null?'-':money(avg),full.length?full.length+' bulan penuh':(curM>=0&&ms[curM].o>0?'baru bulan berjalan':'Belum ada data')],
    ['Bulan terbaik',best<0?'-':MONF[best],best<0?'Belum ada data':money(ms[best].o)],
    [L>0?MON[L]+' dibanding '+MON[P2]:'Pertumbuhan',g===null?'-':pct1(g),g===null?'Belum cukup data':(df>=0?'naik ':'turun ')+money(Math.abs(df)),g===null?'':(g>=0?'in':'out')]
  ]);
  var mx=Math.max.apply(null,ms.map(function(x){return x.o}))||1,hi=curY?curM:best,bars='',lb='';
  ms.forEach(function(x,i){
    var hh=x.o?Math.max(4,Math.round(x.o/mx*104)):2;
    bars+='<div><i class="'+(i===hi?'hi':'')+'" style="height:'+hh+'px"></i></div>';
    lb+='<span>'+MON[i]+'</span>';
  });
  h+='<div class="card"><div class="sp"><b>Omzet per bulan</b><span class="lab">rupiah'+(hi>=0&&ms[hi]&&ms[hi].o?' · '+MON[hi]+': '+nf(ms[hi].o):'')+'</span></div><div class="bars">'+bars+'</div><div class="lb">'+lb+'</div></div>';
  h+='<h3>Rincian bulanan</h3><div class="card" style="padding:6px 14px"><div class="rw rh"><span>Bulan</span><span>Omzet</span><span>Keluar</span><span>Vs bulan lalu</span></div>';
  var idx=[];for(var i=last;i>=0;i--)idx.push(i);
  (S.kAll?idx:idx.slice(0,6)).forEach(function(i){
    var x=ms[i],gv='-',cl='';
    if(i===curM){gv='berjalan';cl=''}else if(i>0&&ms[i-1].o>0&&x.o>0){var gg=(x.o-ms[i-1].o)/ms[i-1].o*100;gv=pct1(gg);cl=gg>=0?'in':'out'}
    h+='<div class="rw"><span>'+(i===curM?MON[i]+' (berjalan)':MONF[i])+'</span><span>'+(x.o?nf(x.o):'-')+'</span><span>'+(x.k?nf(x.k):'-')+'</span><span class="'+cl+'"'+(gv==='berjalan'||gv==='-'?' style="color:var(--mut)"':'')+'>'+gv+'</span></div>';
  });
  h+='</div>';
  if(idx.length>6)h+='<button class="btn sec" id="kAll">'+(S.kAll?'Ringkas':'Tampilkan semua bulan')+'</button>';
  return h+'<div class="note">Rata-rata per bulan dihitung dari bulan yang sudah penuh. Bulan berjalan tidak ikut.</div>';
}
function kPicker(){
  if(!S.kb)S.kb=ymd(new Date()).slice(0,7);
  var y0=new Date().getFullYear(),cur=S.kb.split('-'),ys='',ms='';
  for(var y=y0-5;y<=y0+1;y++)ys+='<option'+(String(y)===cur[0]?' selected':'')+'>'+y+'</option>';
  MONF.forEach(function(n,i){ms+='<option value="'+p2(i+1)+'"'+(p2(i+1)===cur[1]?' selected':'')+'>'+n+'</option>'});
  openSheet('Pilih periode','<label>Bulan</label><select id="kp_m">'+ms+'</select><label>Tahun</label><select id="kp_y">'+ys+'</select><div class="note">Tampilan Harian memakai bulan ini, dan tampilan Bulanan memakai tahunnya.</div><button class="btn" id="kp_ok">Terapkan</button>');
  $('kp_ok').onclick=function(){S.kb=$('kp_y').value+'-'+$('kp_m').value;S.k=null;S.kAll=false;closeSheet();render();loadK()};
}

/* ---------- event ---------- */
$('fab').onclick=function(){openSheet('Catat','<button class="btn" id="m1">Pemasukan</button><button class="btn" id="m2" style="background:var(--out)">Pengeluaran</button><button class="btn sec" id="m3">Transfer antar akun</button><button class="btn sec" id="m4">Hutang / piutang baru</button>');
  $('m1').onclick=function(){txForm('Pemasukan')};$('m2').onclick=function(){txForm('Pengeluaran')};$('m3').onclick=tfForm;$('m4').onclick=function(){hpForm()}};
$('per').onclick=periodForm;
$('rf').onclick=refreshAll;
document.querySelector('nav').onclick=function(e){var nb=e.target.closest?e.target.closest('[data-t]'):null,t=nb&&nb.getAttribute('data-t');if(t){S.tab=t;if(t==='hut'&&!S.h)loadH();if(t==='kin'&&!S.k)loadK();render()}};
$('main').onclick=function(e){
  var el=e.target,i;
  while(el&&el!==this){
    if(el.getAttribute&&el.getAttribute('data-pre')){var pr=el.getAttribute('data-pre');if(pr==='custom')periodForm();else setPreset(pr);return}
    var g=el.getAttribute&&el.getAttribute.bind(el);
    if(g&&g('data-q'))return qSheet(g('data-q'));
    if(g&&g('data-km')){S.km=g('data-km');S.kAll=false;render();return}
    if(el.id==='kPick')return kPicker();
    if(el.id==='kAll'){S.kAll=!S.kAll;render();return}
    if(g&&g('data-eye')){toggleHide(g('data-eye'));return}
    if(g&&g('data-go')){S.ht=g('data-go');S.tab='hut';if(!S.h)loadH();render();return}
    if(g&&g('data-ht')){S.ht=g('data-ht');render();return}
    if(g&&g('data-hp')){hpDetail(g('data-hp'));return}
    if(el.id==='bAddHp')return hpForm(S.ht);
    if(el.id==='bDelCat')return catDelForm();
    if(el.id==='bDelAcc')return accDelForm();
    if(el.id==='bAddAcc')return accForm();
    if(el.id==='bAddCat')return catForm();
    if(el.id==='bOut')return doLogout();
    if(el.className&&String(el.className).indexOf('row')>=0&&el.getAttribute('data-k')){
      var k=el.getAttribute('data-k'),rid=el.getAttribute('data-id');
      if(k==='tx'){var t=S.d.transactions.filter(function(x){return String(x.id)===rid})[0];if(t&&String(t.referensi_id).indexOf('HP:')===0){var hid=String(t.referensi_id).split(':')[2];needH(function(){if(hpFind(hid))hpDetail(hid);else toast('Catatan hutang tidak ditemukan.')})}else if(t)txForm(t.jenis,t)}
      else if(k==='hm'){needH(function(){hpDetail(rid)})}
      else confirmBox('Hapus transfer ini? Saldo kedua akun dihitung ulang.','Hapus').then(function(y){if(y){busy(true);call('deleteTransfer',{id:rid}).then(function(){toast('Dihapus');return refreshAll()}).catch(function(er){toast(er.message)}).then(function(){busy(false)})}});
      return;
    }
    el=el.parentNode;
  }
};
boot();
$('sync').onclick=function(e){
  var t=e.target;
  if(t.id==='sbS')flush().then(function(){if(!P.queue.length&&!P.flushing)return});
  else if(t.id==='sbF'||(t.closest&&t.closest('#sbF')))failSheet();
};
window.addEventListener('online',function(){P.online=true;renderSync();if(P.queue.length)flush();else refreshAll()});
window.addEventListener('offline',function(){P.online=false;renderSync()});
setInterval(function(){if(P.queue.length&&!P.flushing)flush()},20000);
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
/* Beberapa perangkat: saat aplikasi dibuka kembali dari latar belakang, ambil data terbaru (maks. sekali per 30 detik, tidak saat form terbuka). */
function autoRefresh(){
  if(document.visibilityState!=='visible'||!P.online||!S.token||!P.url)return;
  if(document.querySelector('#ov.show'))return;
  if(Date.now()-(P.last||0)<30000)return;
  if(P.queue.length)flush();else refreshAll();
}
document.addEventListener('visibilitychange',autoRefresh);
window.addEventListener('pageshow',function(e){if(e.persisted)autoRefresh()});
